<!DOCTYPE html>
<html>
<head>
    <title>My Contact Form</title>
</head>
<body>
    <h1>Contact Form</h1>

    <form>
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Contact Number:</label>
        <input type="tel" name="contact" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
